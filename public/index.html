<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0a0a0b;
        --bg-deep: #070708;
        --bg-surface: #101216;
        --bg-surface-elevated: #14171c;
        --bg-card: rgba(18, 20, 24, 0.92);
        --bg-card-hover: rgba(22, 24, 28, 0.94);
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.6);
        --text-soft: rgba(255, 255, 255, 0.35);
        --primary: #0066ff;
        --primary-hover: #0052cc;
        --primary-active: #0044aa;
        --primary-soft: rgba(0, 102, 255, 0.12);
        --border-subtle: rgba(255, 255, 255, 0.05);
        --border-default: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.12);
        --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
        --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.5);
        --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-float: 0 32px 64px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
        --menu-bg: rgba(18, 20, 24, 0.98);
        --menu-border: rgba(255, 255, 255, 0.06);
        --menu-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 2px 24px rgba(0, 0, 0, 0.12), 0 8px 42px rgba(0, 0, 0, 0.12), 0 18px 95px rgba(0, 0, 0, 0.06);
        --backdrop-bg: rgba(6, 7, 9, 0.55);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-2xl: 32px;
        --radius-full: 9999px;
        --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.6);
        --text-soft: rgba(255, 255, 255, 0.35);
        --primary: #0066ff;
        --primary-hover: #0052cc;
        --primary-active: #0044aa;
        --primary-soft: rgba(0, 102, 255, 0.12);
        --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
        --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.5);
        --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-float: 0 32px 64px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
        --menu-bg: rgba(18, 20, 24, 0.98);
        --menu-border: rgba(255, 255, 255, 0.06);
        --menu-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 2px 24px rgba(0, 0, 0, 0.12), 0 8px 42px rgba(0, 0, 0, 0.12), 0 18px 95px rgba(0, 0, 0, 0.06);
        --backdrop-bg: rgba(6, 7, 9, 0.55);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-2xl: 32px;
        --radius-full: 9999px;
        --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
        --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.5);
        --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.04);
        --shadow-float: 0 32px 64px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
      }

      html, body {
        height: 100%;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: var(--font-ui);
        background: var(--bg-gradient);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease;
        scrollbar-gutter: stable;
      }

      body.menu-open {
        overflow: hidden;
        padding-right: var(--scrollbar-width, 0px);
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ============================================================
         GLOW
         ============================================================ */
      .glow {
        position: fixed;
        top: 25%;
        left: 50%;
        width: 700px;
        height: 350px;
        background: radial-gradient(circle, rgba(0, 102, 255, 0.1) 0%, transparent 70%);
        filter: blur(70px);
        z-index: -1;
        pointer-events: none;
        animation: pulse 7s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.75; }
      }

      /* ============================================================
         PAGE FRAME & SURFACE
         ============================================================ */
      .page-frame {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
        position: relative;
        z-index: 1;
      }

      .page-surface {
        flex: 1;
        width: 100%;
        max-width: 100%;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-float);
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 48px);
        overflow: hidden;
        position: relative;
      }

      .page-surface::before {
        content: "";
        position: absolute;
        inset: 0;
        background: 
          radial-gradient(ellipse 50% 40% at 50% 0%, rgba(20, 26, 38, 0.3) 0%, transparent 55%),
          radial-gradient(ellipse 30% 25% at 100% 100%, rgba(0, 102, 255, 0.04) 0%, transparent 50%);
        border-radius: inherit;
        pointer-events: none;
      }

      @media (max-width: 768px) {
        .page-frame {
          padding: 16px;
        }
        .page-surface {
          border-radius: var(--radius-xl);
          min-height: calc(100vh - 32px);
        }
      }

      @media (max-width: 480px) {
        .page-frame {
          padding: 12px;
        }
        .page-surface {
          border-radius: var(--radius-lg);
          min-height: calc(100vh - 24px);
        }
      }

      /* ============================================================
         HEADER
         ============================================================ */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 32px;
        background: transparent;
        border-bottom: 1px solid var(--border-subtle);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.4px;
        font-family: var(--font-display);
      }

      .brand svg {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }

      /* Menu Button */
      .menu-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: none;
        background: transparent;
        border-radius: 12px;
        cursor: pointer;
        color: var(--text);
        padding: 0;
        transition: background-color 0.15s ease, color 0.15s ease;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .menu-button:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .menu-button:active {
        background: rgba(255, 255, 255, 0.1);
      }

      .menu-button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .menu-button svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.25s ease, opacity 0.2s ease;
      }

      .menu-button .menu-line-top,
      .menu-button .menu-line-middle,
      .menu-button .menu-line-bottom {
        transform-origin: center;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      }

      .menu-button[aria-expanded="true"] .menu-line-top {
        transform: translateY(5px) rotate(45deg);
      }

      .menu-button[aria-expanded="true"] .menu-line-middle {
        opacity: 0;
      }

      .menu-button[aria-expanded="true"] .menu-line-bottom {
        transform: translateY(-5px) rotate(-45deg);
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-button .menu-line-top,
        .menu-button .menu-line-middle,
        .menu-button .menu-line-bottom {
          transition: none;
        }
      }

      /* ============================================================
         MENU BACKDROP
         ============================================================ */
      .menu-backdrop {
        position: fixed;
        inset: 0;
        background: var(--backdrop-bg);
        backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        z-index: 100;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .menu-backdrop.visible {
        opacity: 1;
        visibility: visible;
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-backdrop {
          transition: opacity 0.01s, visibility 0.01s;
        }
      }

      /* ============================================================
         MENU PANEL (Outer Dialog - Transparent, matches america.gov)
         ============================================================ */
      .menu-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 435px;
        height: 520px;
        background: transparent;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transform: scale(0) translateY(8px);
        transform-origin: top right;
        z-index: 101;
        will-change: transform, opacity;
        transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .menu-panel.visible {
        opacity: 1;
        visibility: visible;
        transform: scale(1) translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-panel {
          transition: opacity 0.01s, visibility 0.01s, transform 0.01s;
        }
      }

      /* Mobile: compact floating panel at top, not fullscreen */
      @media (max-width: 768px) {
        .menu-panel {
          top: 16px;
          left: 16px;
          right: 16px;
          width: auto;
          height: 500px;
          max-height: 500px;
          bottom: auto;
          border-radius: 0;
          padding: 0;
          transform: scale(0) translateY(8px);
        }
      }

      @media (max-width: 480px) {
        .menu-panel {
          top: 16px;
          left: 16px;
          right: 16px;
          width: auto;
          height: 500px;
          max-height: 500px;
          bottom: auto;
          border-radius: 0;
          padding: 0;
          transform: scale(0) translateY(8px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-panel {
          transition: opacity 0.01s, visibility 0.01s, transform 0.01s;
        }
      }

      /* ============================================================
         INNER PANEL WRAPPER (Styled Content - matches america.gov inner div)
         ============================================================ */
      .menu-inner {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: var(--menu-bg);
        border: 1px solid var(--menu-border);
        border-radius: 40px;
        box-shadow: var(--menu-shadow);
        padding: 24px 24px 32px;
        overflow: hidden;
        gap: clamp(1rem, 3dvh, 2rem);
      }

      @media (max-width: 768px) {
        .menu-inner {
          border-radius: 40px;
          padding: 24px 20px 32px;
          gap: 2rem;
        }
      }

      @media (max-width: 480px) {
        .menu-inner {
          border-radius: 36px;
          padding: 20px 16px 28px;
          gap: 1.5rem;
        }
      }

      /* ============================================================
         PANEL HEADER - TOP CONTROLS
         ============================================================ */
      .menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        position: relative;
        z-index: 10;
      }

      /* ============================================================
         PANEL HEADER - TOP CONTROLS
         ============================================================ */
      .menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        position: relative;
        z-index: 10;
      }

      /* Theme Selector - Radio Group (System/Light/Dark) */
      .theme-selector {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .theme-option {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 36px;
        border: none;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-tap-highlight-color: transparent;
        position: relative;
        overflow: hidden;
      }

      .theme-option::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%);
        opacity: 0;
        transition: opacity 0.2s ease;
        border-radius: 6px;
      }

      .theme-option input[type="radio"] {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .theme-option-content {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        border-radius: 6px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1;
      }

      .theme-option:hover .theme-option-content {
        background: rgba(255, 255, 255, 0.06);
      }

      .theme-option:hover::before {
        opacity: 1;
      }

      .theme-option input:checked + .theme-option-content {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 2px 8px rgba(0, 102, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        transform: scale(1.02);
      }

      .theme-option:focus-visible .theme-option-content {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .theme-option-content svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
        transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .theme-option input:checked + .theme-option-content svg {
        transform: scale(1.1);
      }

      .theme-option::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%);
        opacity: 0;
        transition: opacity 0.2s ease;
        border-radius: 6px;
      }

      .theme-option:hover::before {
        opacity: 1;
      }

      @media (max-width: 480px) {
        .theme-option { width: 36px; height: 32px; }
        .theme-option-content svg { width: 18px; height: 18px; }
      }

      /* Close Button */
      .menu-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: none;
        background: transparent;
        border-radius: 12px;
        cursor: pointer;
        color: var(--text-muted);
        padding: 0;
        transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .menu-close:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }

      .menu-close:active {
        background: rgba(255, 255, 255, 0.1);
        transform: scale(0.92);
      }

      .menu-close:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .menu-close svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.2s ease;
      }

      .menu-close:hover svg {
        transform: rotate(90deg);
      }

      @media (max-width: 480px) {
        .menu-close { width: 40px; height: 40px; }
      }

      /* ============================================================
         MAIN NAVIGATION (ul/li structure)
         ============================================================ */
      .menu-nav-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        width: 100%;
      }

      .menu-main-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 28px 16px 20px;
        width: 100%;
      }

      .menu-nav-link {
        display: block;
        width: 100%;
        max-width: 600px;
        text-align: center;
        padding: 18px 24px;
        margin: 0;
        border: none;
        background: transparent;
        color: var(--text);
        font-family: var(--font-ui);
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.01em;
        text-decoration: none;
        cursor: pointer;
        position: relative;
        opacity: 0;
        transform: translateY(16px);
        animation: navLinkIn 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        transition: color 0.2s ease;
      }

      @keyframes navLinkIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .menu-nav-link::after {
        content: '';
        position: absolute;
        bottom: 10px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--primary);
        transform: translateX(-50%);
        opacity: 0;
        transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      }

      .menu-nav-link:hover {
        color: var(--text);
      }

      .menu-nav-link:hover::after {
        width: 60%;
        opacity: 1;
      }

      .menu-nav-link:active {
        color: var(--primary);
      }

      .menu-nav-link:active::after {
        width: 80%;
        background: var(--primary);
      }

      .menu-nav-link:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 8px;
        border-radius: 8px;
      }

      /* Active page indicator */
      .menu-nav-link[aria-current="page"] {
        color: var(--text);
      }

      .menu-nav-link[aria-current="page"]::after {
        width: 100%;
        opacity: 1;
        background: var(--primary);
      }

      /* Staggered delays */
      .menu-nav-link:nth-child(1) { animation-delay: 0.06s; }
      .menu-nav-link:nth-child(2) { animation-delay: 0.12s; }
      .menu-nav-link:nth-child(3) { animation-delay: 0.18s; }
      .menu-nav-link:nth-child(4) { animation-delay: 0.24s; }
      .menu-nav-link:nth-child(5) { animation-delay: 0.30s; }
      .menu-nav-link:nth-child(6) { animation-delay: 0.36s; }

      @media (prefers-reduced-motion: reduce) {
        .menu-nav-link {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 480px) {
        .menu-main-nav {
          padding: 20px 12px 12px;
        }
        .menu-nav-link {
          padding: 14px 16px;
          font-size: clamp(18px, 4vw, 22px);
        }
      }

      /* ============================================================
         SECONDARY NAVIGATION (ul/li structure)
         ============================================================ */
      .menu-secondary-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px 18px;
        width: 100%;
      }

      .menu-secondary-nav {
        width: 100%;
        border-top: 1px solid var(--menu-border);
        margin-top: auto;
        padding-top: 12px;
      }

      .menu-secondary-link {
        display: inline-flex;
        align-items: center;
        padding: 4px 2px;
        border: none;
        background: transparent;
        color: var(--text-soft);
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.12s ease;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(8px);
        animation: secondaryLinkIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes secondaryLinkIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .menu-secondary-link:hover {
        color: var(--text);
      }

      .menu-secondary-link:active {
        color: var(--primary);
        transform: scale(0.98);
      }

      .menu-secondary-link:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 4px;
        border-radius: 4px;
      }

      .menu-secondary-link:nth-child(1) { animation-delay: 0.3s; }
      .menu-secondary-link:nth-child(2) { animation-delay: 0.34s; }
      .menu-secondary-link:nth-child(3) { animation-delay: 0.38s; }
      .menu-secondary-link:nth-child(4) { animation-delay: 0.42s; }

      @media (prefers-reduced-motion: reduce) {
        .menu-secondary-link {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 480px) {
        .menu-secondary-nav {
          padding-top: 8px;
        }
        .menu-secondary-link { font-size: 10px; }
      }

      /* ============================================================
         HERO SECTION
         ============================================================ */
      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 40px 80px;
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 100%;
      }

      .hero h1 {

        font-size: clamp(2.75rem, 8vw, 6rem);
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.035em;

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }

      .hero p {
        font-size: clamp(1.05rem, 1.8vw, 1.35rem);

      .glow {
        position: fixed;
        top: 25%;
        left: 50%;
        width: 700px;
        height: 350px;
        background: radial-gradient(circle, rgba(0, 102, 255, 0.1) 0%, transparent 70%);

        z-index: -1;
        pointer-events: none;
        animation: pulse 7s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.75; }
      }

      /* ============================================================
         SEARCH CONTAINER & IMAGE CAROUSEL
         ============================================================ */
      .search-container {
        width: 100%;
        max-width: 920px;
        border-radius: var(--radius-2xl);
        overflow: hidden;
        position: relative;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both;
        box-shadow: var(--shadow-xl);
        aspect-ratio: 16 / 9.5;
      }

      .search-container .carousel {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: var(--radius-2xl);
        background: var(--bg-deep);
      }

      .search-container .carousel-track {
        display: flex;
        width: 400%;
        height: 100%;
        transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform;
      }

      .search-container .carousel-slide {
        flex: none;
        width: 25%;
        height: 100%;
        position: relative;
      }

      .search-container .carousel-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .search-card {
        position: absolute;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 720px;
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-full);
        padding: 12px 20px 12px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: var(--shadow-card);
        backdrop-filter: blur(24px) saturate(1.5);
        z-index: 10;
      }

      .search-bar {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 12px;
      }

      .search-input-wrapper {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }

      .search-input {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 16px;
        font-weight: 400;
        padding: 12px 4px;
        outline: none;
        caret-color: var(--primary);
        font-family: var(--font-ui);
        -webkit-appearance: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.01em;
      }

      .search-input::placeholder {
        color: var(--text-soft);
      }

      .search-input:focus {
        outline: none;
      }

      .search-submit {
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: var(--radius-full);
        background: var(--primary);
        border: none;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 16px rgba(0, 102, 255, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        transition: transform 0.1s ease, background 0.12s ease, box-shadow 0.12s ease;
        padding: 0;
      }

      .search-submit:hover {
        background: var(--primary-hover);
        transform: scale(1.06);
        box-shadow: 0 8px 24px rgba(0, 102, 255, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      }

      .search-submit:active {
        background: var(--primary-active);
        transform: scale(0.95);
        box-shadow: 0 3px 10px rgba(0, 102, 255, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      }

      .search-submit:disabled {
        background: #3a3f4a;
        color: #6a6f7a;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .search-submit svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .sending .arrow {
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .search-card.sending .search-input {
        opacity: 0.55;
      }

      @media (max-width: 640px) {
        header { padding: 16px 20px; }
        .hero { padding: 40px 20px 60px; }
        .hero h1 { font-size: 2.5rem; }
        .hero p { margin-bottom: 40px; }

      }

         GLOBAL STYLES

        content: "";
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(ellipse 60% 50% at 50% 15%, rgba(20, 26, 38, 0.45) 0%, transparent 60%),
          radial-gradient(ellipse 40% 35% at 80% 80%, rgba(0, 102, 255, 0.06) 0%, transparent 50%),
          radial-gradient(ellipse 35% 30% at 15% 70%, rgba(0, 82, 204, 0.05) 0%, transparent 55%);
        pointer-events: none;

      body::after {

      .sr-only {

        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto.
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important.
          animation-iteration-count: 1 !important.
          transition-duration: 0.01ms !important.
        }
      }
    </style>

    <script>
      /* ============================================================
         MENU INTERACTION
         ============================================================ */
      (function() {
        const menuButton = document.getElementById('menuButton');
        const menuBackdrop = document.getElementById('menuBackdrop');
        const menuPanel = document.getElementById('menuPanel');
        const menuClose = document.getElementById('menuClose');
        const menuNavLinks = menuPanel.querySelectorAll('.menu-nav-link');
        const menuSecondaryLinks = menuPanel.querySelectorAll('.menu-secondary-link');
        const themeRadios = menuPanel.querySelectorAll('.theme-option input[type="radio"]');
        const body = document.body;

        let lastFocusedElement = null;
        let currentTheme = 'system';

        function openMenu() {
          lastFocusedElement = document.activeElement;
          const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
          document.documentElement.style.setProperty('--scrollbar-width', scrollbarWidth + 'px');
          menuButton.setAttribute('aria-expanded', 'true');
          menuBackdrop.classList.add('visible');
          menuBackdrop.setAttribute('aria-hidden', 'false');
          menuPanel.classList.add('visible');
          body.classList.add('menu-open');
          menuClose.focus();
          document.addEventListener('keydown', handleKeydown);
        }

        function closeMenu() {
          menuButton.setAttribute('aria-expanded', 'false');
          menuBackdrop.classList.remove('visible');
          menuBackdrop.setAttribute('aria-hidden', 'true');
          menuPanel.classList.remove('visible');
          body.classList.remove('menu-open');
          document.documentElement.style.removeProperty('--scrollbar-width');
          document.removeEventListener('keydown', handleKeydown);
          if (lastFocusedElement) {
            lastFocusedElement.focus();
          } else {
            menuButton.focus();
          }
        }

        function handleKeydown(e) {
          if (e.key === 'Escape') {
            closeMenu();
          }
          // Trap focus within menu
          if (e.key === 'Tab') {
            const focusableElements = menuPanel.querySelectorAll(
              'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            );
            const firstElement = focusableElements[0];
            const lastElement = focusableElements[focusableElements.length - 1];
            
            if (e.shiftKey && document.activeElement === firstElement) {
              e.preventDefault();
              lastElement.focus();
            } else if (!e.shiftKey && document.activeElement === lastElement) {
              e.preventDefault();
              firstElement.focus();
            }
          }
        }

        menuButton.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuBackdrop.addEventListener('click', closeMenu);

        // Close on menu link click
        [...menuNavLinks, ...menuSecondaryLinks].forEach(link => {
          link.addEventListener('click', closeMenu);
        });

        // Theme selector functionality (radio inputs)
        themeRadios.forEach(radio => {
          radio.addEventListener('change', () => {
            if (radio.checked) {
              currentTheme = radio.value;
              applyTheme(currentTheme);
            }
          });

          radio.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              radio.click();
            }
          });
        });

        function applyTheme(theme) {
          const root = document.documentElement;
          root.removeAttribute('data-theme');
          if (theme !== 'system') {
            root.setAttribute('data-theme', theme);
          }
          console.log('Theme changed to:', theme);
        }

        // Prevent clicks inside panel from closing
        menuPanel.addEventListener('click', (e) => {
          e.stopPropagation();
        });
      })();

      /* ============================================================
         CAROUSEL & SEARCH
         ============================================================ */
      const suggestions = [
        { img: '/img1.jpg', aspect: 1536/1085, text: 'Try "How do I contact the school administration?"' },
        { img: '/img2.jpg', aspect: 1536/1151, text: 'Try "Where can I find information about school events and activities?"' },
        { img: '/img3.jpg', aspect: 1536/1025, text: 'Try "Where can I find the school\'s academic calendar and important dates?"' },
        { img: '/img4.jpg', aspect: 1536/1024, text: 'Try "How can I find the school\'s facilities and infrastructure?"' },
      ];

      const input = document.querySelector('.search-input');
      const submit = document.getElementById('searchSubmit');
      const card = document.getElementById('searchCard');
      const track = document.getElementById('carouselTrack');
      const carousel = document.getElementById('carousel');

      let currentIndex = 0;
      let timer = null;

      function setContainerAspect(aspect) {
        carousel.style.aspectRatio = aspect.toFixed(4);
      }

      function setSlide(index) {
        currentIndex = index % suggestions.length;
        track.style.transform = `translateX(-${currentIndex * 25}%)`;
        input.placeholder = suggestions[currentIndex].text;
        setContainerAspect(suggestions[currentIndex].aspect);
      }

      function startCarousel() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          setSlide(currentIndex + 1);
        }, 8000);
      }

      function stopCarousel() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      window.addEventListener('beforeunload', stopCarousel);

      setSlide(0);
      startCarousel();

      let sending = false;

      function setSending(state) {
        sending = state;
        if (state) {
          card.classList.add('sending');
          submit.classList.add('sending');
          submit.disabled = true;
          submit.setAttribute('aria-busy', 'true');
        } else {
          card.classList.remove('sending');
          submit.classList.remove('sending');
          submit.disabled = false;
          submit.removeAttribute('aria-busy');
        }
      }

      function submitSearch() {
        const q = input.value.trim();
        if (!q || sending) return;
        setSending(true);
        setTimeout(() => {
          setSending(false);
          input.value = '';
          input.focus();
        }, 1200);
      }

      submit.addEventListener('click', submitSearch);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitSearch();
      });

      input.focus();
    </script>
