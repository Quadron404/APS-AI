<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0d0f14;
        --bg-gradient: radial-gradient(ellipse 80% 60% at 50% 20%, #141a26 0%, #0a0d14 55%, #080a0f 100%);
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.7);
        --primary: #0066ff;
        --primary-hover: #0052cc;
        --primary-active: #0044aa;
        --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Cormorant Garamond", Georgia, serif;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--font-ui);
        background: var(--bg-gradient);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .glow {
        position: fixed;
        top: 25%;
        left: 50%;
        width: 700px;
        height: 350px;
        background: radial-gradient(circle, rgba(0, 102, 255, 0.12) 0%, transparent 70%);
        filter: blur(70px);
        z-index: -1;
        pointer-events: none;
        animation: pulse 7s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.55; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.85; }
      }

      header {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 32px;
        background: rgba(10, 10, 14, 0.45);
        backdrop-filter: blur(16px) saturate(1.3);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.4px;
        font-family: var(--font-display);
      }

      .brand svg {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }

      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 24px 100px;
        position: relative;
        z-index: 10;
      }

      .hero h1 {
        font-family: var(--font-display);
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.04em;
        margin-bottom: 14px;
        max-width: 900px;
        animation: fadeInUp 1s ease both;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .hero p {
        font-size: clamp(1rem, 1.9vw, 1.4rem);
        color: var(--text-muted);
        margin-bottom: 48px;
        max-width: 680px;
        line-height: 1.65;
        font-weight: 400;
        animation: fadeInUp 1s ease 0.15s both;
      }

      .search-container {
        width: 100%;
        max-width: 960px;
        border-radius: 30px;
        overflow: visible;
        position: relative;
        animation: fadeInUp 1s ease 0.3s both;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }

      .search-container .carousel {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 30px;
        background: #000;
      }

      .search-container .carousel-track {
        display: flex;
        width: 400%;
        transition: transform 0.6s ease;
        will-change: transform;
      }

      .search-container .carousel-slide {
        flex: none;
        width: 25%;
        position: relative;
      }

      .search-container .carousel-slide img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        object-position: center;
      }

      .search-card {
        position: absolute;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 760px;
        background: rgba(18, 20, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        padding: 10px 16px 10px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(20px) saturate(1.4);
        z-index: 10;
      }

      .search-bar {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 12px;
      }

      .search-input-wrapper {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }

      .search-input {
        width: 100%;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 15px;
        font-weight: 400;
        padding: 10px 4px;
        outline: none;
        caret-color: var(--primary);
        font-family: var(--font-ui);
        -webkit-appearance: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }

      .search-input:focus {
        outline: none;
      }

      .search-submit {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--primary);
        border: none;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 102, 255, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
        padding: 0;
      }

      .search-submit:hover {
        background: var(--primary-hover);
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(0, 102, 255, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      }

      .search-submit:active {
        background: var(--primary-active);
        transform: scale(0.96);
        box-shadow: 0 2px 8px rgba(0, 102, 255, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      }

      .search-submit:disabled {
        background: #3a3f4a;
        color: #6a6f7a;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .search-submit svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .sending .arrow {
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .search-card.sending .search-input {
        opacity: 0.55;
      }

      @media (max-width: 640px) {
        header { padding: 14px 20px; }
        .hero h1 { font-size: 2.7rem; }
        .hero p { margin-bottom: 32px; }
        .search-container { border-radius: 24px; }
        .search-card { 
          top: 24px; 
          width: 92%; 
          max-width: 520px; 
          padding: 12px 14px; 
          gap: 10px; 
          border-radius: 999px;
        }
        .search-bar { gap: 10px; }
        .search-input { 
          font-size: 14px; 
          padding: 12px 4px; 
          white-space: normal; 
          overflow: visible;
          text-overflow: clip;
          line-height: 1.35;
          min-height: 36px;
        }
        .search-submit { 
          width: 40px; 
          height: 40px; 
        }
        .search-submit svg { width: 18px; height: 18px; }
      }
    </style>
  </head>
  <body>

    <div class="glow"></div>

    <header>
      <a href="/" class="brand" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 22h16V2H4zm2-5h12v-2H6zM4 20h16v-2H4z"/>
        </svg>
        <span>APS AI</span>
      </a>
    </header>

    <main class="hero">
      <h1>Hello, World</h1>
      <p>Whatever you need from school, start here.</p>

      <div class="search-container" id="searchContainer">
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide">
              <img src="/img1.jpg" alt="" aria-hidden="true" />
            </div>
            <div class="carousel-slide">
              <img src="/img2.jpg" alt="" aria-hidden="true" />
            </div>
            <div class="carousel-slide">
              <img src="/img3.jpg" alt="" aria-hidden="true" />
            </div>
            <div class="carousel-slide">
              <img src="/img4.jpg" alt="" aria-hidden="true" />
            </div>
          </div>
        </div>
        <div class="search-card" id="searchCard">
          <div class="search-bar">
            <div class="search-input-wrapper">
              <input
                type="search"
                class="search-input"
                placeholder="Try 'Where can I enlist in the armed services?'"
                aria-label="Search"
                autocomplete="off"
              />
            </div>
            <button class="search-submit" id="searchSubmit" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const suggestions = [
        { img: '/img1.jpg', aspect: 1536/1085, text: 'Try "How do I contact the school administration?"' },
        { img: '/img2.jpg', aspect: 1536/1151, text: 'Try "Where can I find information about school events and activities?"' },
        { img: '/img3.jpg', aspect: 1536/1025, text: 'Try "Where can I find the school\'s academic calendar and important dates?"' },
        { img: '/img4.jpg', aspect: 1536/1024, text: 'Try "How can I find the school\'s facilities and infrastructure?"' },
      ];

      const input = document.querySelector('.search-input');
      const submit = document.getElementById('searchSubmit');
      const card = document.getElementById('searchCard');
      const track = document.getElementById('carouselTrack');
      const carousel = document.getElementById('carousel');

      let currentIndex = 0;
      let timer = null;

      function setContainerAspect(aspect) {
        carousel.style.aspectRatio = aspect.toFixed(4);
      }

      function setSlide(index) {
        currentIndex = index % suggestions.length;
        track.style.transform = `translateX(-${currentIndex * 25}%)`;
        input.placeholder = suggestions[currentIndex].text;
        setContainerAspect(suggestions[currentIndex].aspect);
      }

      function startCarousel() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          setSlide(currentIndex + 1);
        }, 8000);
      }

      function stopCarousel() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      window.addEventListener('beforeunload', stopCarousel);

      setSlide(0);
      startCarousel();

      let sending = false;

      function setSending(state) {
        sending = state;
        if (state) {
          card.classList.add('sending');
          submit.classList.add('sending');
          submit.disabled = true;
          submit.setAttribute('aria-busy', 'true');
        } else {
          card.classList.remove('sending');
          submit.classList.remove('sending');
          submit.disabled = false;
          submit.removeAttribute('aria-busy');
        }
      }

      function submitSearch() {
        const q = input.value.trim();
        if (!q || sending) return;
        setSending(true);
        setTimeout(() => {
          setSending(false);
          input.value = '';
          input.focus();
        }, 1200);
      }

      submit.addEventListener('click', submitSearch);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitSearch();
      });

      input.focus();
    </script>
  </body>
</html>
