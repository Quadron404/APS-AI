<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0d0f14;
        --bg-gradient: radial-gradient(ellipse 80% 60% at 50% 20%, #141a26 0%, #0a0d14 55%, #080a0f 100%);
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.6);
        --text-soft: rgba(255, 255, 255, 0.4);
        --primary: #0066ff;
        --primary-hover: #0052cc;
        --primary-active: #0044aa;
        --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Cormorant Garamond", Georgia, serif;
        --menu-bg: rgba(18, 20, 24, 0.98);
        --menu-border: rgba(255, 255, 255, 0.06);
        --menu-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 2px 24px rgba(0, 0, 0, 0.1), 0 8px 42px rgba(0, 0, 0, 0.1), 0 18px 95px rgba(0, 0, 0, 0.05);
        --backdrop-bg: rgba(8, 10, 14, 0.5);
      }

      html, body {
        height: 100%;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: var(--font-ui);
        background: var(--bg-gradient);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease;
        scrollbar-gutter: stable;
      }

      body.menu-open {
        overflow: hidden;
        padding-right: var(--scrollbar-width, 0px);
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ============================================================
         GLOW
         ============================================================ */
      .glow {
        position: fixed;
        top: 25%;
        left: 50%;
        width: 700px;
        height: 350px;
        background: radial-gradient(circle, rgba(0, 102, 255, 0.1) 0%, transparent 70%);
        filter: blur(70px);
        z-index: -1;
        pointer-events: none;
        animation: pulse 7s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.75; }
      }

      /* ============================================================
         HEADER
         ============================================================ */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 32px;
        background: rgba(10, 10, 14, 0.45);
        backdrop-filter: blur(16px) saturate(1.3);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.4px;
        font-family: var(--font-display);
      }

      .brand svg {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }

      /* Menu Button */
      .menu-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: none;
        background: transparent;
        border-radius: 12px;
        cursor: pointer;
        color: var(--text);
        padding: 0;
        transition: background-color 0.15s ease, color 0.15s ease;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .menu-button:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .menu-button:active {
        background: rgba(255, 255, 255, 0.1);
      }

      .menu-button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .menu-button svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.25s ease, opacity 0.2s ease;
      }

      .menu-button[aria-expanded="true"] .menu-line-top {
        transform: translateY(6px) rotate(45deg);
      }

      .menu-button[aria-expanded="true"] .menu-line-middle {
        opacity: 0;
      }

      .menu-button[aria-expanded="true"] .menu-line-bottom {
        transform: translateY(-6px) rotate(-45deg);
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-button .menu-line-top,
        .menu-button .menu-line-middle,
        .menu-button .menu-line-bottom {
          transition: none;
        }
      }

      /* ============================================================
         MENU BACKDROP
         ============================================================ */
      .menu-backdrop {
        position: fixed;
        inset: 0;
        background: var(--backdrop-bg);
        backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        z-index: 100;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .menu-backdrop.visible {
        opacity: 1;
        visibility: visible;
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-backdrop {
          transition: opacity 0.01s, visibility 0.01s;
        }
      }

      /* ============================================================
         MENU PANEL (Outer Dialog - Transparent, matches america.gov)
         ============================================================ */
      .menu-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 435px;
        height: 472px;
        background: transparent;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transform: scale(0) translateY(8px);
        transform-origin: top right;
        z-index: 101;
        will-change: transform, opacity;
        transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .menu-panel.visible {
        opacity: 1;
        visibility: visible;
        transform: scale(1) translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-panel {
          transition: opacity 0.01s, visibility 0.01s, transform 0.01s;
        }
      }

      /* Mobile: compact floating panel at top, not fullscreen */
      @media (max-width: 768px) {
        .menu-panel {
          top: 16px;
          left: 16px;
          right: 16px;
          width: auto;
          height: 429px;
          max-height: 429px;
          bottom: auto;
          border-radius: 0;
          padding: 0;
          transform: scale(0) translateY(8px);
        }
      }

      @media (max-width: 480px) {
        .menu-panel {
          top: 16px;
          left: 16px;
          right: 16px;
          width: auto;
          height: 429px;
          max-height: 429px;
          bottom: auto;
          border-radius: 0;
          padding: 0;
          transform: scale(0) translateY(8px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-panel {
          transition: opacity 0.01s, visibility 0.01s, transform 0.01s;
        }
      }

      /* ============================================================
         INNER PANEL WRAPPER (Styled Content - matches america.gov inner div)
         ============================================================ */
      .menu-inner {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: var(--menu-bg);
        border: 1px solid var(--menu-border);
        border-radius: 40px;
        box-shadow: var(--menu-shadow);
        padding: 24px 24px 48px;
        overflow-y: auto;
        overscroll-behavior: contain;
        gap: clamp(1rem, 3dvh, 2rem);
      }

      @media (max-width: 768px) {
        .menu-inner {
          border-radius: 40px;
          padding: 40px 40px 64px;
          gap: 2.75rem;
        }
      }

      @media (max-width: 480px) {
        .menu-inner {
          border-radius: 36px;
          padding: 40px 40px 64px;
          gap: 2.75rem;
        }
      }

      /* ============================================================
         PANEL HEADER - TOP CONTROLS
         ============================================================ */
      .menu-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        position: relative;
        z-index: 10;
      }

      /* Theme Selector - Segmented Control (System/Light/Dark) */
      .theme-selector {
        display: inline-flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--menu-border);
        border-radius: 10px;
        padding: 3px;
        gap: 1px;
      }

      .theme-option {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border: none;
        background: transparent;
        border-radius: 8px;
        color: var(--text-muted);
        font-family: var(--font-ui);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
        -webkit-tap-highlight-color: transparent;
        white-space: nowrap;
      }

      .theme-option:hover {
        color: var(--text);
      }

      .theme-option.active {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 2px 8px rgba(0, 102, 255, 0.3);
      }

      .theme-option:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .theme-option svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      @media (max-width: 480px) {
        .theme-option { padding: 4px 8px; font-size: 11px; }
        .theme-option svg { width: 11px; height: 11px; }
      }

      /* Close Button */
      .menu-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: none;
        background: transparent;
        border-radius: 10px;
        cursor: pointer;
        color: var(--text-muted);
        padding: 0;
        transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .menu-close:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }

      .menu-close:active {
        background: rgba(255, 255, 255, 0.1);
        transform: scale(0.92);
      }

      .menu-close:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .menu-close svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.2s ease;
      }

      .menu-close:hover svg {
        transform: rotate(90deg);
      }

      @media (max-width: 480px) {
        .menu-close { width: 36px; height: 36px; }
      }

      /* ============================================================
         MAIN NAVIGATION
         ============================================================ */
      .menu-main-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 20px 12px 16px;
        width: 100%;
      }

      .menu-nav-link {
        display: block;
        width: 100%;
        max-width: 600px;
        text-align: center;
        padding: 14px 18px;
        margin: 0;
        border: none;
        background: transparent;
        color: var(--text);
        font-family: var(--font-ui);
        font-size: clamp(18px, 2.8vw, 24px);
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.01em;
        text-decoration: none;
        cursor: pointer;
        position: relative;
        opacity: 0;
        transform: translateY(12px);
        animation: navLinkIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        transition: color 0.2s ease;
      }

      @keyframes navLinkIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .menu-nav-link::after {
        content: '';
        position: absolute;
        bottom: 10px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--primary);
        transform: translateX(-50%);
        opacity: 0;
        transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
      }

      .menu-nav-link:hover {
        color: var(--text);
      }

      .menu-nav-link:hover::after {
        width: 60%;
        opacity: 1;
      }

      .menu-nav-link:active {
        color: var(--primary);
      }

      .menu-nav-link:active::after {
        width: 80%;
        background: var(--primary);
      }

      .menu-nav-link:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 8px;
        border-radius: 8px;
      }

      /* Active page indicator */
      .menu-nav-link[aria-current="page"] {
        color: var(--text);
      }

      .menu-nav-link[aria-current="page"]::after {
        width: 100%;
        opacity: 1;
        background: var(--primary);
      }

      /* Staggered delays */
      .menu-nav-link:nth-child(1) { animation-delay: 0.06s; }
      .menu-nav-link:nth-child(2) { animation-delay: 0.12s; }
      .menu-nav-link:nth-child(3) { animation-delay: 0.18s; }
      .menu-nav-link:nth-child(4) { animation-delay: 0.24s; }
      .menu-nav-link:nth-child(5) { animation-delay: 0.30s; }
      .menu-nav-link:nth-child(6) { animation-delay: 0.36s; }

      @media (prefers-reduced-motion: reduce) {
        .menu-nav-link {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 480px) {
        .menu-main-nav {
          padding: 20px 12px 12px;
        }
        .menu-nav-link {
          padding: 14px 16px;
          font-size: clamp(18px, 4vw, 22px);
        }
      }

      /* ============================================================
         SECONDARY NAVIGATION
         ============================================================ */
      .menu-secondary-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px 18px;
        padding: 12px 12px 4px;
        width: 100%;
        border-top: 1px solid var(--menu-border);
        margin-top: auto;
      }

      .menu-secondary-link {
        display: inline-flex;
        align-items: center;
        padding: 4px 2px;
        border: none;
        background: transparent;
        color: var(--text-soft);
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.12s ease;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(8px);
        animation: secondaryLinkIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes secondaryLinkIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .menu-secondary-link:hover {
        color: var(--text);
      }

      .menu-secondary-link:active {
        color: var(--primary);
        transform: scale(0.98);
      }

      .menu-secondary-link:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 4px;
        border-radius: 4px;
      }

      .menu-secondary-link:nth-child(1) { animation-delay: 0.3s; }
      .menu-secondary-link:nth-child(2) { animation-delay: 0.34s; }
      .menu-secondary-link:nth-child(3) { animation-delay: 0.38s; }
      .menu-secondary-link:nth-child(4) { animation-delay: 0.42s; }

      @media (prefers-reduced-motion: reduce) {
        .menu-secondary-link {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 480px) {
        .menu-secondary-nav {
          gap: 8px 14px;
          padding: 8px 8px 0;
        }
        .menu-secondary-link { font-size: 10px; }
      }

      /* ============================================================
         HERO SECTION
         ============================================================ */
      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 24px 100px;
        position: relative;
        z-index: 10;
      }

      .hero h1 {
        font-family: var(--font-display);
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.04em;
        margin-bottom: 14px;
        max-width: 900px;
        animation: fadeInUp 1s ease both;
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .hero p {
        font-size: clamp(1rem, 1.9vw, 1.4rem);
        color: var(--text-muted);
        margin-bottom: 48px;
        max-width: 680px;
        line-height: 1.65;
        font-weight: 400;
        animation: fadeInUp 1s ease 0.15s both;
      }

      .glow {
        position: fixed;
        top: 25%;
        left: 50%;
        width: 700px;
        height: 350px;
        background: radial-gradient(circle, rgba(0, 102, 255, 0.1) 0%, transparent 70%);
        filter: blur(70px);
        z-index: -1;
        pointer-events: none;
        animation: pulse 7s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.75; }
      }

      /* ============================================================
         SEARCH CONTAINER
         ============================================================ */
      .search-container {
        width: 100%;
        max-width: 960px;
        border-radius: 30px;
        overflow: visible;
        position: relative;
        animation: fadeInUp 1s ease 0.3s both;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }

      .search-container .carousel {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 30px;
        background: #000;
      }

      .search-container .carousel-track {
        display: flex;
        width: 400%;
        transition: transform 0.6s ease;
        will-change: transform;
      }

      .search-container .carousel-slide {
        flex: none;
        width: 25%;
        position: relative;
      }

      .search-container .carousel-slide img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        object-position: center;
      }

      .search-card {
        position: absolute;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 760px;
        background: rgba(18, 20, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        padding: 10px 16px 10px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(20px) saturate(1.4);
        z-index: 10;
      }

      .search-bar {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 12px;
      }

      .search-input-wrapper {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }

      .search-input {
        width: 100%;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 15px;
        font-weight: 400;
        padding: 10px 4px;
        outline: none;
        caret-color: var(--primary);
        font-family: var(--font-ui);
        -webkit-appearance: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }

      .search-input:focus {
        outline: none;
      }

      .search-submit {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--primary);
        border: none;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 102, 255, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
        padding: 0;
      }

      .search-submit:hover {
        background: var(--primary-hover);
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(0, 102, 255, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      }

      .search-submit:active {
        background: var(--primary-active);
        transform: scale(0.96);
        box-shadow: 0 2px 8px rgba(0, 102, 255, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      }

      .search-submit:disabled {
        background: #3a3f4a;
        color: #6a6f7a;
        cursor: not-allowed;
        transform: none;
        box-shadow: none.
      }

      .search-submit svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .sending .arrow {
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .search-card.sending .search-input {
        opacity: 0.55.
      }

      @media (max-width: 640px) {
        header { padding: 14px 20px; }
        .hero h1 { font-size: 2.7rem; }
        .hero p { margin-bottom: 32px; }
        .search-container { border-radius: 24px; }
        .search-card { 
          top: 24px; 
          width: 92%; 
          max-width: 520px; 
          padding: 12px 14px; 
          gap: 10px; 
          border-radius: 999px;
        }
        .search-bar { gap: 10px; }
        .search-input { 
          font-size: 14px; 
          padding: 12px 4px; 
          white-space: normal; 
          overflow: visible;
          text-overflow: clip;
          line-height: 1.35;
          min-height: 36px;
        }
        .search-submit { 
          width: 40px; 
          height: 40px; 
        }
        .search-submit svg { width: 18px; height: 18px; }
      }

      /* ============================================================
         GLOBAL STYLES
         ============================================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: var(--font-ui);
        background: var(--bg-gradient);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease;
        scrollbar-gutter: stable.
      }

      body.menu-open {
        overflow: hidden;
        padding-right: var(--scrollbar-width, 0px).
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto.
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important.
          animation-iteration-count: 1 !important.
          transition-duration: 0.01ms !important.
        }
      }
    </style>
  </head>
  <body>

    <div class="glow"></div>

    <header>
      <a href="/" class="brand" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 22h16V2H4zm2-5h12v-2H6zM4 20h16v-2H4z"/>
        </svg>
        <span>APS AI</span>
      </a>
      <button class="menu-button" id="menuButton" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line class="menu-line-top" x1="4" y1="7" x2="20" y2="7"/>
          <line class="menu-line-middle" x1="4" y1="12" x2="20" y2="12"/>
          <line class="menu-line-bottom" x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </header>

    <!-- Menu Backdrop -->
    <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>

    <!-- Menu Panel (Outer Dialog - Transparent, matches america.gov) -->
    <div class="menu-panel" id="menuPanel" role="dialog" aria-modal="true" aria-label="Navigation menu">
      <!-- Inner Panel Wrapper (Styled Content - matches america.gov inner div) -->
      <div class="menu-inner">
        <!-- Panel Header - Top Controls -->
        <div class="menu-header">
          <!-- Theme Selector - Segmented Control (System/Light/Dark) -->
          <div class="theme-selector" role="group" aria-label="Theme selector">
            <button class="theme-option" data-theme="system" aria-pressed="true" aria-label="System theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
              </svg>
              <span>System</span>
            </button>
            <button class="theme-option" data-theme="light" aria-pressed="false" aria-label="Light theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <span>Light</span>
            </button>
            <button class="theme-option" data-theme="dark" aria-pressed="false" aria-label="Dark theme">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
              <span>Dark</span>
            </button>
          </div>
          <button class="menu-close" id="menuClose" aria-label="Close menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <nav class="menu-main-nav" aria-label="Main navigation">
          <a href="/" class="menu-nav-link" aria-current="page">Home</a>
          <a href="#about" class="menu-nav-link">About</a>
          <a href="#services" class="menu-nav-link">Services</a>
          <a href="#insights" class="menu-nav-link">Insights</a>
          <a href="#contact" class="menu-nav-link">Contact</a>
          <a href="#login" class="menu-nav-link">Sign In</a>
        </nav>

        <nav class="menu-secondary-nav" aria-label="Secondary navigation">
          <a href="#privacy" class="menu-secondary-link">Privacy</a>
          <a href="#terms" class="menu-secondary-link">Terms</a>
          <a href="#accessibility" class="menu-secondary-link">Accessibility</a>
          <a href="#help" class="menu-secondary-link">Help</a>
        </nav>
      </div>
    </div>

    <main class="hero">
      <h1>Hello, World</h1>
      <p>Whatever you need from school, start here.</p>

      <div class="search-container" id="searchContainer">
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carouselTrack">
            <div class="carousel-slide">
              <img src="/img1.jpg" alt="" aria-hidden="true" />
            </div>
            <div class="carousel-slide">
              <img src="/img2.jpg" alt="" aria-hidden="true" />
            </div>
            <div class="carousel-slide">
              <img src="/img3.jpg" alt="" aria-hidden="true" />
            </div>
            <div class="carousel-slide">
              <img src="/img4.jpg" alt="" aria-hidden="true" />
            </div>
          </div>
        </div>
        <div class="search-card" id="searchCard">
          <div class="search-bar">
            <div class="search-input-wrapper">
              <input
                type="search"
                class="search-input"
                placeholder="Try 'Where can I enlist in the armed services?'"
                aria-label="Search"
                autocomplete="off"
              />
            </div>
            <button class="search-submit" id="searchSubmit" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      /* ============================================================
         MENU INTERACTION
         ============================================================ */
      (function() {
        const menuButton = document.getElementById('menuButton');
        const menuBackdrop = document.getElementById('menuBackdrop');
        const menuPanel = document.getElementById('menuPanel');
        const menuClose = document.getElementById('menuClose');
        const menuNavLinks = menuPanel.querySelectorAll('.menu-nav-link');
        const menuSecondaryLinks = menuPanel.querySelectorAll('.menu-secondary-link');
        const themeOptions = menuPanel.querySelectorAll('.theme-option');
        const body = document.body;

        let lastFocusedElement = null;
        let currentTheme = 'system';

        function openMenu() {
          lastFocusedElement = document.activeElement;
          const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
          document.documentElement.style.setProperty('--scrollbar-width', scrollbarWidth + 'px');
          menuButton.setAttribute('aria-expanded', 'true');
          menuBackdrop.classList.add('visible');
          menuBackdrop.setAttribute('aria-hidden', 'false');
          menuPanel.classList.add('visible');
          body.classList.add('menu-open');
          menuClose.focus();
          document.addEventListener('keydown', handleKeydown);
        }

        function closeMenu() {
          menuButton.setAttribute('aria-expanded', 'false');
          menuBackdrop.classList.remove('visible');
          menuBackdrop.setAttribute('aria-hidden', 'true');
          menuPanel.classList.remove('visible');
          body.classList.remove('menu-open');
          document.documentElement.style.removeProperty('--scrollbar-width');
          document.removeEventListener('keydown', handleKeydown);
          if (lastFocusedElement) {
            lastFocusedElement.focus();
          } else {
            menuButton.focus();
          }
        }

        function handleKeydown(e) {
          if (e.key === 'Escape') {
            closeMenu();
          }
          // Trap focus within menu
          if (e.key === 'Tab') {
            const focusableElements = menuPanel.querySelectorAll(
              'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            );
            const firstElement = focusableElements[0];
            const lastElement = focusableElements[focusableElements.length - 1];
            
            if (e.shiftKey && document.activeElement === firstElement) {
              e.preventDefault();
              lastElement.focus();
            } else if (!e.shiftKey && document.activeElement === lastElement) {
              e.preventDefault();
              firstElement.focus();
            }
          }
        }

        menuButton.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        menuBackdrop.addEventListener('click', closeMenu);

        // Close on menu link click
        [...menuNavLinks, ...menuSecondaryLinks].forEach(link => {
          link.addEventListener('click', closeMenu);
        });

        // Theme selector functionality
        themeOptions.forEach(option => {
          option.addEventListener('click', () => {
            // Remove active from all
            themeOptions.forEach(opt => {
              opt.classList.remove('active');
              opt.setAttribute('aria-pressed', 'false');
            });
            // Add active to clicked
            option.classList.add('active');
            option.setAttribute('aria-pressed', 'true');
            currentTheme = option.dataset.theme;
            // Apply theme
            applyTheme(currentTheme);
          });

          option.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              option.click();
            }
          });
        });

        function applyTheme(theme) {
          const root = document.documentElement;
          root.removeAttribute('data-theme');
          if (theme !== 'system') {
            root.setAttribute('data-theme', theme);
          }
          console.log('Theme changed to:', theme);
        }

        // Prevent clicks inside panel from closing
        menuPanel.addEventListener('click', (e) => {
          e.stopPropagation();
        });
      })();

      /* ============================================================
         CAROUSEL & SEARCH
         ============================================================ */
      const suggestions = [
        { img: '/img1.jpg', aspect: 1536/1085, text: 'Try "How do I contact the school administration?"' },
        { img: '/img2.jpg', aspect: 1536/1151, text: 'Try "Where can I find information about school events and activities?"' },
        { img: '/img3.jpg', aspect: 1536/1025, text: 'Try "Where can I find the school\'s academic calendar and important dates?"' },
        { img: '/img4.jpg', aspect: 1536/1024, text: 'Try "How can I find the school\'s facilities and infrastructure?"' },
      ];

      const input = document.querySelector('.search-input');
      const submit = document.getElementById('searchSubmit');
      const card = document.getElementById('searchCard');
      const track = document.getElementById('carouselTrack');
      const carousel = document.getElementById('carousel');

      let currentIndex = 0;
      let timer = null;

      function setContainerAspect(aspect) {
        carousel.style.aspectRatio = aspect.toFixed(4);
      }

      function setSlide(index) {
        currentIndex = index % suggestions.length;
        track.style.transform = `translateX(-${currentIndex * 25}%)`;
        input.placeholder = suggestions[currentIndex].text;
        setContainerAspect(suggestions[currentIndex].aspect);
      }

      function startCarousel() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          setSlide(currentIndex + 1);
        }, 8000);
      }

      function stopCarousel() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      window.addEventListener('beforeunload', stopCarousel);

      setSlide(0);
      startCarousel();

      let sending = false;

      function setSending(state) {
        sending = state;
        if (state) {
          card.classList.add('sending');
          submit.classList.add('sending');
          submit.disabled = true;
          submit.setAttribute('aria-busy', 'true');
        } else {
          card.classList.remove('sending');
          submit.classList.remove('sending');
          submit.disabled = false;
          submit.removeAttribute('aria-busy');
        }
      }

      function submitSearch() {
        const q = input.value.trim();
        if (!q || sending) return;
        setSending(true);
        setTimeout(() => {
          setSending(false);
          input.value = '';
          input.focus();
        }, 1200);
      }

      submit.addEventListener('click', submitSearch);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitSearch();
      });

      input.focus();
    </script>
  </body>
</html>
